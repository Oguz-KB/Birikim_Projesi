services:
  - type: web
    name: birikim-backend
    env: python
    plan: free
    rootDir: birikim-app/backend
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false # User will provide this in the Render dashboard
